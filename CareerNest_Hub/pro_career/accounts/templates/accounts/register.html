{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register - CareerNest</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            height: 100vh;
            font-family: 'Poppins', sans-serif;
            overflow: hidden;

            background: radial-gradient(circle at 20% 30%, #2563eb 0%, transparent 40%),
                        radial-gradient(circle at 80% 70%, #1e40af 0%, transparent 40%),
                        linear-gradient(135deg, #0f172a, #1e3a8a);

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .top-buttons {
            position: absolute;
            top: 20px;
            right: 30px;
        }

        .card-box {
            width: 420px;
            padding: 40px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(18px);
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.15);
            box-shadow: 
                0 20px 60px rgba(0,0,0,0.6),
                inset 0 0 20px rgba(255,255,255,0.05);
            color: white;
            text-align: center;
        }

        .logo {
            width: 65px;
            margin-bottom: 10px;
        }

        h2 {
            font-weight: 700;
            margin-bottom: 25px;
        }

        .form-control {
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            border-radius: 10px;
            padding: 12px;
        }

        .form-control::placeholder {
            color: #ccc;
        }

        .form-control:focus {
            background: rgba(255,255,255,0.25);
            border-color: #60a5fa;
            box-shadow: 0 0 10px rgba(96,165,250,0.5);
            color: white;
        }

        .btn-main {
            background: linear-gradient(45deg, #2563eb, #3b82f6);
            border: none;
            width: 100%;
            padding: 12px;
            font-weight: 600;
            border-radius: 10px;
        }

        .btn-main:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(59,130,246,0.4);
        }

        .extra-links a {
            color: #93c5fd;
            font-size: 14px;
            text-decoration: none;
        }

        .extra-links a:hover {
            text-decoration: underline;
        }

        .footer-text {
            font-size: 12px;
            margin-top: 15px;
            color: #aaa;
        }
    </style>
</head>

<body>



<div class="card-box">

    <img src="{% static 'img/careernest-logo.svg' %}" class="logo">

    <h2>Create Account</h2>

    <form method="POST">
        {% csrf_token %}

        <input type="text" name="username" class="form-control mb-3" placeholder="Username" required>

        <input type="email" name="email" class="form-control mb-3" placeholder="Email" required>

        <input type="password" name="password" class="form-control mb-3" placeholder="Password" required>

        <button type="submit" class="btn btn-main">
            Register
        </button>
    </form>

    <div class="extra-links mt-3">
        <a href="{% url 'login' %}">Back to login</a>
    </div>

    <div class="footer-text">
        CareerNest Hub © 2026
    </div>

</div>

</body>
</html>
