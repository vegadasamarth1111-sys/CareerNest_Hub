{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel - CareerNest</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            height: 100vh;
            font-family: 'Poppins', sans-serif;
            overflow: hidden;

            /* 🔥 PREMIUM BACKGROUND */
            background: radial-gradient(circle at 20% 30%, #2563eb 0%, transparent 40%),
                        radial-gradient(circle at 80% 70%, #1e40af 0%, transparent 40%),
                        linear-gradient(135deg, #0f172a, #1e3a8a);

            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 🔥 GLASS CARD */
        .login-card {
            width: 400px;
            padding: 40px;

            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(18px);

            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.15);

            box-shadow: 
                0 20px 60px rgba(0,0,0,0.6),
                inset 0 0 20px rgba(255,255,255,0.05);

            color: white;
            text-align: center;

            animation: fadeIn 0.8s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* LOGO */
        .logo {
            width: 65px;
            margin-bottom: 10px;
        }

        /* BADGE */
        .badge-admin {
            background: linear-gradient(45deg, #f59e0b, #fbbf24);
            color: black;
            font-size: 12px;
            padding: 6px 14px;
            border-radius: 30px;
            margin-bottom: 12px;
            display: inline-block;
            font-weight: 600;
        }

        h2 {
            font-weight: 700;
            margin-bottom: 25px;
        }

        /* INPUT */
        .form-control {
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            border-radius: 10px;
            padding: 12px;
        }

        .form-control::placeholder {
            color: #ccc;
        }

        .form-control:focus {
            background: rgba(255,255,255,0.25);
            border-color: #60a5fa;
            box-shadow: 0 0 10px rgba(96,165,250,0.5);
            color: white;
        }

        /* BUTTON */
        .btn-login {
            background: linear-gradient(45deg, #2563eb, #3b82f6);
            border: none;
            width: 100%;
            padding: 12px;
            font-weight: 600;
            border-radius: 10px;
            transition: 0.3s;
        }

        .btn-login:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 10px 25px rgba(59,130,246,0.5);
        }

        /* CHECKBOX */
        .form-check-label {
            font-size: 14px;
            color: #ddd;
        }

        .error {
            color: #ff6b6b;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .footer-text {
            font-size: 12px;
            margin-top: 18px;
            color: #aaa;
        }
    </style>
</head>

<body>

<div class="login-card">

    <!-- LOGO -->
    <img src="{% static 'img/careernest-logo.svg' %}" class="logo">

    <!-- BADGE -->
    <div class="badge-admin">Admin Panel</div>

    <h2>Welcome Back</h2>

    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <input type="text" name="username" class="form-control mb-3"
               placeholder="Username" required>

        <input type="password" name="password" class="form-control mb-3"
               placeholder="Password" required>

        <!-- REMEMBER -->
        <div class="form-check text-start mb-3">
            <input class="form-check-input" type="checkbox" id="remember">
            <label class="form-check-label" for="remember">
                Remember me
            </label>
        </div>

        <button type="submit" class="btn btn-login">
            Login
        </button>

    </form>

    <div class="footer-text">
        CareerNest Hub © 2026
    </div>

</div>

</body>
</html>
