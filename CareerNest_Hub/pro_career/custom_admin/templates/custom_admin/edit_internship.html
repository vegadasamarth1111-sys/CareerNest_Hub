{% extends "admin_panel/base.html" %}

{% block title %}Edit Internship{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="fw-bold mb-0">Edit Internship</h2>
    <a href="{% url 'custom_admin:admin_internships' %}" class="btn btn-outline-secondary">Back</a>
</div>

<div class="card shadow-sm border-0">
    <div class="card-body">
        <form method="post" class="row g-3">
            {% csrf_token %}
            <div class="col-md-6">
                <label class="form-label">Title</label>
                <input type="text" name="title" value="{{ internship.title }}" class="form-control" required>
            </div>
            <div class="col-md-6">
                <label class="form-label">Company</label>
                <input type="text" name="company" value="{{ internship.company }}" class="form-control" required>
            </div>
            <div class="col-md-6">
                <label class="form-label">Location</label>
                <input type="text" name="location" value="{{ internship.location }}" class="form-control" required>
            </div>
            <div class="col-md-3">
                <label class="form-label">Stipend</label>
                <input type="text" name="stipend" value="{{ internship.stipend }}" class="form-control" required>
            </div>
            <div class="col-md-3">
                <label class="form-label">Duration</label>
                <input type="text" name="duration" value="{{ internship.duration }}" class="form-control" required>
            </div>
            <div class="col-12">
                <label class="form-label">Description</label>
                <textarea name="description" class="form-control" rows="4" required>{{ internship.description }}</textarea>
            </div>
            <div class="col-12">
                <button type="submit" class="btn btn-warning">Update Internship</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
