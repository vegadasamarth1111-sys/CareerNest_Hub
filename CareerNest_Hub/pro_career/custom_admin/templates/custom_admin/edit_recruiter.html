{% extends "admin_panel/base.html" %}

{% block title %}Edit Recruiter{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="fw-bold mb-0">Edit Recruiter</h2>
    <a href="{% url 'custom_admin:admin_recruiters' %}" class="btn btn-outline-secondary">Back</a>
</div>

{% if messages %}
    {% for message in messages %}
        <div class="alert alert-{{ message.tags|default:'info' }}">{{ message }}</div>
    {% endfor %}
{% endif %}

<div class="card shadow-sm border-0">
    <div class="card-body">
        <form method="post" class="row g-3">
            {% csrf_token %}
            <div class="col-md-6">
                <label class="form-label">Username</label>
                <input type="text" name="username" value="{{ user_obj.username }}" class="form-control" required>
            </div>
            <div class="col-md-6">
                <label class="form-label">Email</label>
                <input type="email" name="email" value="{{ user_obj.email }}" class="form-control" required>
            </div>
            <div class="col-md-6">
                <label class="form-label">New Password (Optional)</label>
                <input type="password" name="password" class="form-control" placeholder="Leave blank to keep current password">
            </div>
            <div class="col-md-6">
                <label class="form-label">Company Name (Optional)</label>
                <input type="text" name="company_name" value="{{ profile.company_name|default:'' }}" class="form-control">
            </div>
            <div class="col-12">
                <button type="submit" class="btn btn-warning">Update Recruiter</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
